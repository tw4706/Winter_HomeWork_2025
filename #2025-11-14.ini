#2025-11-14
##前回のおさらい
-入力とイベントの対応関係を編子できるようにしました
-キャンセルできるようにしました
-メニュー
### 入力とイベントの対応関係を変更できるように
最終目的はinput.inputTable_内のvectorの内容を変更する
無軌道に変更できるようにしてしまうと非常に扱いづらいので、
いくつか制約を設けておきます。
-editモードである(状態遷移で可能)
-登録している入力しか受け付けないようにする
### エディットモード
通常モードと、エディットモードを消え変えて
エディットモードでは、行が固定されエディットモードの
時にのみ生入力を受け付けて、その内容でinput_.inputTable_を書き換える
エディットモード⇔通常モードの切り替えは"ok"ボタンで行う
生入力なので、IsTriggerが実装されておらず
エディットモードに入った瞬間は入ったキーである"OK"が入力されていることがあるため、
これを防止するためにcurrent,lastのペアを作る
だけでは不十分でした。なぜ不十分化というとエディット
モードに入るまでは生入力がないため、lastが初期状態に
なっており、必ずTriggerになっていた。
→EditingUpdateの最初の1フレームだけは何もしないで
生入力状態だけ更新しておく
## キャンセルできるように
キーコンフィグして、キャンセルしたい場合があります。このときに、エディットモードで変更した
内容がその瞬間に反映されていると、扱いづらいというのもあるし、元の入力情報も消えてしまっているため
キャンセルもできない。
→Inputクラス内にtempInputTable_というものを宣言し、一時的なイベント⇔名魔乳りょき情報のテーブルを
作ります。KeyConfigでいじるのはこの一時的なテーブル変更内容を破棄できます。
ただし、最終的にゲームに反映するために、Save&Exitを行うことで、本来のInput.inputTable_に
反映させるようにしています。
### メニュー回り
最終的に、変更したいイベント情報以外に、Save&Exit,Cancel&Exit,Resetなどのようなめにゅーを
追加したいため、ぽーじ画面と同様にメニューリストvectorと、それに対する実行関数のマップも
用意する。

### 表示回り
キーの集合+メニューであるため、インデックスの範囲は0～(キーの集合+メニュー)-1になります。
0～キーの集合-1であれば、エディット可能だしそれ以降であればメニューを実行ということにします。

### データのセーブ
今回はキーコンフィグの情報をセーブします
### セーブデータを作るときのヒント
-しょっぱなからやみくもに作らない
-データ構造を最初に考えて決めよう
-ファイルシグネチャ(署名=何のファイルなのか)を先頭
に書く
-次にバージョン番号を記録(データ構造が永久に同じとは
限らないため)
-データ数(今回はインプットテーブルのデータ数)

### inputTableのセーブデータ構造
-4バイト:"kcnf"
-4バイト(float):バージョン番号
-4バイト(int):inputTable.size()
ここからはループが入っています
文字データのようにサイズが不定のものはデータの前にサイズを
1バイトで記入しておきます
-イベント名(文字列サイズ、文字データ)
-生データ情報:サイズ(4バイト)
-生データ情報:データ部(種別,コード)→8バイト
これらのデータを「バイナリデータ」として書き込んでいきます

### バイナリデータとテキストデータ
テキストデータ:人間が読みやすい(比較的)
→見れば、数値とかが文字列として書いてあるので
何とか読める。
コンピュータ的には読むのに手間がかかる。サイズが増えやすい
バイナリデータ:まず人間は読めません。コンピュータがめ
っちゃ読みやすい。サイズが最小限

ただし、人間が読みづらいため、それを何とかして読みやすくするための
つーるがあります。それを「バイナリエディタ」と
いいます。
とりあえず僕がよく使ってるバイナリエディタを紹介しておきます
(バイナリエディタはたくさんあるので、なれたら自分が
使いやすいものを探しましょう)
TSXBINというツールです。:最新版は作者のwebさいとにあるの
でそこが一番安全だと思います。
